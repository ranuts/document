name: ZZ Fetch Probe
on:
  push:
    branches: [arena/90f90a00-documentoffice]
    paths: ['.scratch/papers/trigger.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/90f90a00-documentoffice
      - name: Connectivity check
        run: |
          set -x
          curl -sS -o /dev/null -w "mdpi:%{http_code}\n" --max-time 20 https://www.mdpi.com/1422-0067/25/14/7715/pdf || true
          curl -sS -o /dev/null -w "europepmc:%{http_code}\n" --max-time 20 "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=test&format=json" || true
          curl -sS -o /dev/null -w "openalex:%{http_code}\n" --max-time 20 "https://api.openalex.org/works?per-page=1" || true
          curl -sS -o /dev/null -w "unpaywall:%{http_code}\n" --max-time 20 "https://api.unpaywall.org/v2/10.3390/ijms25147715?email=test@example.com" || true
          curl -sS -o /dev/null -w "pmc:%{http_code}\n" --max-time 20 "https://pmc.ncbi.nlm.nih.gov/articles/PMC11277333/" || true
          curl -sS -o /dev/null -w "frontiers:%{http_code}\n" --max-time 20 "https://www.frontiersin.org/journals/cell-and-developmental-biology/articles/10.3389/fcell.2025.1655623/full" || true
      - name: Push test
        run: |
          mkdir -p .scratch/papers
          echo "probe $(date -u +%FT%TZ)" > .scratch/papers/PROBE.txt
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -A .scratch/papers
          git commit -m "chore: probe push from actions" || echo "nothing to commit"
          git push origin HEAD:arena/90f90a00-documentoffice && echo "PUSH_OK" || echo "PUSH_FAILED"

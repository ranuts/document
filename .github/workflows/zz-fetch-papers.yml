name: ZZ Fetch Papers

on:
  push:
    branches: [arena/90f90a00-documentoffice]
    paths: ['.scratch/papers/trigger.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zz-fetch-papers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/90f90a00-documentoffice
          fetch-depth: 1

      - name: Environment
        run: |
          python3 --version
          (command -v google-chrome || command -v google-chrome-stable || command -v chromium) || echo "NO CHROME"
          command -v gs || (sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript) || true
          echo "round: $(cat .scratch/papers/round.txt 2>/dev/null || echo all)"

      - name: Fetch open-access PDFs
        run: |
          ROUND="$(cat .scratch/papers/round.txt 2>/dev/null || echo all)"
          python3 .scratch/papers/fetch_papers.py "$ROUND"

      - name: Commit results
        if: always()
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -A papers .scratch/papers || true
          git commit -m "feat(papers): download open-access PDFs" || echo "no changes to commit"
          git push origin HEAD:arena/90f90a00-documentoffice

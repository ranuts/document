name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run oxlint and TypeScript checks
        run: pnpm run lint:ts

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

      - name: Validate Docker Compose file
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e

      # The lint job only validates compose config and Dockerfile style; this
      # actually builds the image and runs the full e2e suite against the
      # container, proving the production image serves the editor correctly
      # (this is what caught the workspace-manifest install breakage).
      - name: Build Docker image
        run: docker build -t document:e2e .

      - name: Run E2E tests against the Docker image
        run: pnpm exec playwright test --config playwright.docker.config.ts

      - name: Remove Docker E2E container
        if: always()
        run: docker rm -f document-e2e-docker 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-docker/
          retention-days: 7

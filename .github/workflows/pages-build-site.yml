name: pages-build-site
on:
  # The editor now lives at https://edit.chaxus.com (Cloudflare Pages).
  # GitHub Pages publishes ONLY a client-side redirector (redirect/), so old
  # ranuts.github.io/document/* links keep working (path + query preserved).
  # GitHub Pages keeps serving the last published artifact, so the redirector
  # only needs republishing when it changes; every other push to main used to
  # redeploy the same two files. workflow_dispatch republishes by hand.
  push:
    branches:
      - main
    paths:
      - "redirect/**"
      - ".github/workflows/pages-build-site.yml"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Publish redirector
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No build: just ship the static redirector (redirect/index.html + 404.html).
      - name: Upload redirector artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./redirect"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

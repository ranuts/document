<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="img/64.png" rel="shortcut icon" />
    <link rel="icon" type="image/png" href="img/64.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

    <!-- /history: the local document library. Everything it lists lives in this
         browser's IndexedDB and has never been uploaded, so there is nothing
         here for a crawler to see and nothing that would mean the same thing
         to a different visitor. Its UI language follows the app's i18n
         (?locale=), not a per-language static page. -->
    <title>Local history</title>
    <meta name="robots" content="noindex" />
    <script>
      try {
        var t = localStorage.getItem('ran-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-ran-theme', t);
          document.documentElement.setAttribute('theme', t);
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/ran-fonts/fonts.css" />
    <link rel="stylesheet" href="/ran-tokens.css" />
    <!-- The site's chrome comes from the same stylesheet every other page uses,
         rather than being re-measured here: this page is a destination people
         reach from the homepage, and losing the header on the way there makes
         it read as a different site. /embed-demo.html follows the same pattern
         (shared bar, no footer -- an app surface, not an article). -->
    <link rel="stylesheet" href="/landing.css" />
    <script src="/ranui-iife/select.iife.js" defer></script>
    <script src="/ranui-iife/theme-switch.iife.js" defer></script>
    <script src="/lang-switch.js" defer></script>
  </head>

  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="gh-mark" viewBox="0 0 16 16">
        <path
          fill="currentColor"
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
        />
      </symbol>
    </svg>

    <header class="bar">
      <a class="brand" href="/"><span class="logo">D</span>Document Editor</a>
      <nav>
        <span class="lang-wrap">
          <svg class="langmark" aria-hidden="true" viewBox="0 0 16 16">
            <circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path
              d="M1.75 8h12.5M8 1.75c1.7 1.8 2.6 3.9 2.6 6.25S9.7 12.45 8 14.25M8 1.75c-1.7 1.8-2.6 3.9-2.6 6.25s.9 4.45 2.6 6.25"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
            />
          </svg>
          <!-- Both targets are this page; the locale rides in the query, which
               is what the app's i18n reads. -->
          <r-select class="lang-select" type="text" value="en" aria-label="Language">
            <r-option value="en" data-href="/history?locale=en">EN</r-option>
            <r-option value="zh-CN" data-href="/history?locale=zh-CN">中文</r-option>
            <r-option value="ja" data-href="/history?locale=ja">日本語</r-option>
            <r-option value="de" data-href="/history?locale=de">Deutsch</r-option>
            <r-option value="es" data-href="/history?locale=es">Español</r-option>
            <r-option value="ko" data-href="/history?locale=ko">한국어</r-option>
            <r-option value="pt" data-href="/history?locale=pt">Português</r-option>
          </r-select>
        </span>
        <a href="https://github.com/ranuts/document" rel="noopener" target="_blank">
          <svg class="ghmark" aria-hidden="true"><use href="#gh-mark"></use></svg> GitHub
        </a>
        <r-theme-switch class="theme-switch" label="Theme"></r-theme-switch>
      </nav>
    </header>

    <main id="history-root"></main>

    <noscript>
      <p style="max-width: 720px; margin: 0 auto; padding: 24px; font-family: system-ui, sans-serif">
        This page needs JavaScript to read the documents stored in your browser.
      </p>
    </noscript>
  </body>
  <script type="module" src="./lib/history-page.ts"></script>
</html>
